name: ตรวจสอบ ThaiBan AI

on:
  push:
    branches: [main, thaibanai-v1.1-validation]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ดึงโค้ด
        uses: actions/checkout@v4

      - name: ติดตั้ง Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: ติดตั้งแพ็กเกจ
        run: npm install

      - name: ตรวจสอบ Build
        run: npm run build

      - name: ติดตั้งเบราว์เซอร์ทดสอบ
        run: npx playwright install --with-deps chromium

      - name: ทดสอบมือถือและฟีเจอร์เดิม
        run: npm run test:e2e

      - name: เก็บภาพและผลทดสอบ
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-validation
          path: test-results/
          retention-days: 7
